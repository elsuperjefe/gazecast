<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2150"/>
      <stop offset="1" stop-color="#0a0c1f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa8ff"/>
      <stop offset="0.55" stop-color="#b08cff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#d6fff6"/>
      <stop offset="0.45" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2a7fe8"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- gaze ring with a gap that "closes" like a dwell ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="30"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="30" stroke-linecap="round" stroke-dasharray="700 943" transform="rotate(-100 256 256)"/>
  <!-- iris + pupil -->
  <circle cx="256" cy="256" r="74" fill="url(#iris)"/>
  <circle cx="256" cy="256" r="32" fill="#0a0c1f"/>
  <circle cx="234" cy="232" r="14" fill="#ffffff" fill-opacity="0.9"/>
</svg>
